name: Build WeKnora Lite Image

# 说明：GitHub Actions 就是"云端构建机"。
# 整个编译过程（装 Go、装 Node、编前端、编后端）全部跑在 GitHub 的机器上，
# 本地和 NAS 一个依赖都不用装，也不占用 NAS 的内存。

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'WeKnora 上游版本标签，例如 v0.8.2'
        required: true
        default: 'v0.8.2'
      image_tag:
        description: '镜像标签（留空则自动取上游版本号，去掉开头的 v）'
        required: false
        default: ''

  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '*.md'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------------
      # 1. 解析版本号
      # ------------------------------------------------------------------
      - name: 解析参数
        id: vars
        run: |
          set -euo pipefail

          REF="${{ inputs.upstream_ref }}"
          if [ -z "$REF" ]; then REF="v0.8.2"; fi

          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${REF#v}"; fi

          # GHCR 要求镜像名全小写
          IMAGE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # 构建时间戳。不用 github.run_started_at —— 实测在 push 触发时它为空。
          # 用 ISO 格式是为了不带空格，免得 ldflags 被拆断。
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          echo "ref=$REF"             >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"         >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

          echo "上游版本：$REF"
          echo "镜像标签：$TAG"
          echo "镜像名称：$IMAGE"

      # ------------------------------------------------------------------
      # 2. 拉取上游源码（编译的对象）
      # ------------------------------------------------------------------
      - name: 拉取上游 WeKnora 源码
        uses: actions/checkout@v4
        with:
          repository: Tencent/WeKnora
          ref: ${{ steps.vars.outputs.ref }}
          path: src

      # ------------------------------------------------------------------
      # 3. 检出本仓库（提供 Dockerfile / entrypoint / .dockerignore）
      # ------------------------------------------------------------------
      - name: 检出本仓库的构建文件
        uses: actions/checkout@v4
        with:
          path: img

      # ------------------------------------------------------------------
      # 4. 组装构建上下文
      # ------------------------------------------------------------------
      - name: 组装构建上下文
        run: |
          set -euo pipefail

          cp img/Dockerfile    src/Dockerfile
          cp img/entrypoint.sh src/entrypoint.sh

          # 关键一步：用本仓库的忽略规则覆盖上游那份。
          # 上游 .dockerignore 排除了整个 frontend/ 目录，
          # 而 Lite 镜像必须编译前端，沿用它会导致 COPY frontend/ 失败。
          cp img/dockerignore  src/.dockerignore

          echo "--- 构建上下文就绪 ---"
          ls -l src/Dockerfile src/entrypoint.sh src/.dockerignore
          echo "--- 确认前端源码可被 COPY ---"
          ls -l src/frontend/package.json src/frontend/package-lock.json

      # ------------------------------------------------------------------
      # 5. 构建并推送镜像
      # ------------------------------------------------------------------
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:latest
          build-args: |
            WK_VERSION=${{ steps.vars.outputs.ref }}
            WK_COMMIT=${{ github.sha }}
            WK_BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # 6. 摘要
      # ------------------------------------------------------------------
      - name: 输出摘要
        run: |
          {
            echo "## 构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 上游版本 | \`${{ steps.vars.outputs.ref }}\` |"
            echo "| 镜像地址 | \`${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\` |"
            echo "| 平台 | linux/amd64 |"
          } >> "$GITHUB_STEP_SUMMARY"
